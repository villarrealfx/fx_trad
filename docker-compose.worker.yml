# Compose para el E2E de TASK-004: RabbitMQ + worker Celery.
# El compose general de 4 servicios es `docker-compose.yml` (TASK-038, ADR-009);
# este archivo conserva solo el par worker/broker para validar el ciclo de
# descarga asíncrona en dev sin levantar frontend ni API.
services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  worker:
    build:
      context: ./backend
      target: worker
    environment:
      - FXTRAD_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - FXTRAD_DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    depends_on:
      - rabbitmq
