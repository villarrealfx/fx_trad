# Compose para el E2E de TASK-004: RabbitMQ + worker Celery.
# El compose general de 4 servicios (frontend, backend, worker, broker) es
# TASK-038 (ADR-009); aquí solo se define el par worker/broker para validar
# el ciclo de descarga asíncrona de extremo a extremo en dev.
services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    environment:
      - FXTRAD_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
    depends_on:
      - rabbitmq