# Integración continua (TASK-039, ADR-008): lint + tests al hacer push o PR.
#
# Reutiliza los mismos comandos que el desarrollo local (`make lint-backend`,
# `make test-backend`, `make lint-frontend`, `make test-frontend`): el Makefile
# es la única fuente de verdad, de modo que CI y local no divergen.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Lint (ruff + black + mypy)
        run: make lint-backend
      - name: Tests (pytest)
        run: make test-backend

  frontend:
    name: Frontend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint (eslint + tsc + prettier)
        run: make lint-frontend
      - name: Tests (vitest)
        run: make test-frontend
