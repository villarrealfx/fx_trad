[project]
name = "fxtrad"
version = "0.1.0"
description = "Backend: Plataforma de Analisis Tecnico (estilo TradingView)"
requires-python = ">=3.12"
dependencies = [
    "celery[amqp]>=5,<6",
    "fastapi>=0.110,<1",
    "pydantic>=2.6,<3",
    "structlog>=24,<26",
    "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
    "black>=24,<25",
    "mypy>=1.10,<2",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E203"]

[tool.ruff.lint.isort]
known-first-party = ["fxtrad"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
