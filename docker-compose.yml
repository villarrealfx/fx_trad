# Docker Compose de uso personal-local (TASK-038, ADR-009): 4 servicios
# (`frontend`, `backend`, `worker`, `broker`) y el volumen `data/` compartido por
# la API y el worker. El mismo compose es el entorno de uso: sin staging/prod.
#
#   docker compose up --build
#
# Frontend  http://localhost:5173  (Vite proxya la API al servicio `backend`)
# Backend   http://localhost:8000  (FastAPI)
# RabbitMQ  http://localhost:15672 (management, guest/guest)
name: fxtrad

services:
  broker:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: api
    environment:
      FXTRAD_DATA_DIR: /app/data
      FXTRAD_BROKER_URL: amqp://guest:guest@broker:5672//
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      broker:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      target: worker
    environment:
      FXTRAD_DATA_DIR: /app/data
      FXTRAD_BROKER_URL: amqp://guest:guest@broker:5672//
    volumes:
      - ./data:/app/data
    depends_on:
      broker:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
